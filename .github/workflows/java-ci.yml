name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Java 8 — Maven verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Verify application without Raspberry Pi hardware
        run: mvn -B -ntp clean verify
